name: Monthly SEO Suite health sync

on:
  schedule:
    # 1st of every month at 05:00 UTC — monthly content + technical health checks
    - cron: "0 5 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install supabase google-api-python-client google-auth-httplib2 google-auth-oauthlib pyyaml

      - name: Content freshness / decay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python seo_tools/seo-suite/freshness.py --force
        working-directory: ${{ github.workspace }}

      - name: Technical site audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python seo_tools/seo-suite/site_audit.py --force
        working-directory: ${{ github.workspace }}
