# Cloudflare Pages deployment config for Vantage Circle SEO Suite
# The _worker.js in this directory is deployed as the Pages Function.
name = "orbit"
compatibility_date = "2026-08-20"

pages_build_output_dir = "."

# Pages projects do not use the top-level 'main_entry_point' / 'workers' keys.
# Run locally:  npx wrangler pages dev .
# Deploy:       CLOUDFLARE_ACCOUNT_ID=<id> npx wrangler pages deploy . --project-name=orbit-v4o
