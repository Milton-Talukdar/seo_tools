name: SEO suite

on:
  schedule:
    - cron: "53 6 * * 1"   # Mondays 06:53 UTC — LLM tracker itself runs biweekly (see gate step)
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: seo-suite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Track Google rankings (DataForSEO SERP API)
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 rank_track.py

      - name: Snapshot backlink profile
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 backlinks.py

      - name: Track competitor sitemap/page changes
        run: python3 competitor_tracker.py

      - name: Monthly gate (run freshness on 1st of month or manual)
        id: monthly
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%d)" = "01" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Content freshness / decay monitor
        if: steps.monthly.outputs.run == '1'
        run: python3 freshness.py

      - name: Biweekly gate (run LLM tracker on even ISO weeks only)
        id: gate
        run: echo "run=$(( $(date +%V) % 2 == 0 ))" >> "$GITHUB_OUTPUT"

      - name: Track LLM visibility (DataForSEO AI Optimization API)
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == '1'
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 llm_visibility.py --property vantagecircle && python3 llm_visibility.py --property vantagefit

      - name: Monthly LLM discovery (volumes + real prompts)
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 llm_discover.py --property vantagecircle && python3 llm_discover.py --property vantagefit   # self-throttled: at most once per 25 days per property

      - name: Monthly keyword enrichment (volume + KD + intent)
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 enrich.py   # self-throttled: runs at most once per 25 days

      - name: Commit updated SQLite data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo_suite.db
          git diff --cached --quiet || git commit -m "Update SEO suite data ($(date +%F))"
          git push
