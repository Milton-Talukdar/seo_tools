name: Weekly Screaming Frog site audit

on:
  schedule:
    # Every Sunday at 04:00 UTC — deep technical crawl before Monday standups
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-suite/requirements.txt || true
          pip install supabase

      - name: Install Screaming Frog SEO Spider
        env:
          SCREAMING_FROG_DEB_URL: ${{ secrets.SCREAMING_FROG_DEB_URL }}
        run: |
          if [ -z "$SCREAMING_FROG_DEB_URL" ]; then
            echo "SCREAMING_FROG_DEB_URL secret is required to install Screaming Frog in CI"
            exit 1
          fi
          curl -L -o screamingfrog.deb "$SCREAMING_FROG_DEB_URL"
          sudo apt-get update
          sudo apt-get install -y ./screamingfrog.deb
          rm screamingfrog.deb
          screamingfrogseospider --version || true

      - name: Verify Screaming Frog licence
        env:
          SCREAMING_FROG_LICENCE: ${{ secrets.SCREAMING_FROG_LICENCE }}
        run: |
          mkdir -p ~/.ScreamingFrogSEOSpider
          printf '%s' "$SCREAMING_FROG_LICENCE" > ~/.ScreamingFrogSEOSpider/licence.txt
          bytes=$(wc -c < ~/.ScreamingFrogSEOSpider/licence.txt)
          lines=$(awk 'END{print NR}' ~/.ScreamingFrogSEOSpider/licence.txt)
          echo "Licence file bytes: $bytes"
          echo "Licence file lines: $lines"
          if [ "$bytes" -lt 100 ]; then
            echo "ERROR: SCREAMING_FROG_LICENCE secret appears too short. Copy the entire licence.txt contents from Screaming Frog."
            exit 1
          fi

      - name: Run Screaming Frog site audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCREAMING_FROG_LICENCE: ${{ secrets.SCREAMING_FROG_LICENCE }}
        run: python seo-suite/site_audit.py --force --provider screamingfrog
        working-directory: ${{ github.workspace }}
