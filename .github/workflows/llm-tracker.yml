name: LLM visibility tracker

on:
  schedule:
    - cron: "47 6 * * 1"   # Mondays 06:47 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-keyword-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tracker (DataForSEO API)
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 llm_track.py

      - name: Build dashboard
        run: python3 dashboard.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm_visibility.db index.html
          git diff --cached --quiet || git commit -m "Update LLM visibility dashboard ($(date +%F))"
          git push
